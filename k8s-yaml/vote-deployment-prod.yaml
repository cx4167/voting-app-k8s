apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: voting-app-dev
  labels:
    app: vote
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        image: denish952/voting-app-vote:39
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 80
        
        env:
        - name: FLASK_ENV
          valueFrom:
            configMapKeyRef:
              name: voting-config-prod
              key: FLASK_ENV
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: voting-secrets-prod
              key: SECRET_KEY
        - name: DATABASE_PATH
          valueFrom:
            configMapKeyRef:
              name: voting-config-prod
              key: DATABASE_PATH
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: voting-config-prod
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: voting-config-prod
              key: REDIS_PORT
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /login
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        
        readinessProbe:
          httpGet:
            path: /login
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: vote-service
  namespace: voting-app-dev
spec:
  selector:
    app: vote
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
